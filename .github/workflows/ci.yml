name: Linux/Windows builds

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux-build:
    runs-on: ubuntu-26.04

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      # Force vcpkg to use an explicit local folder inside the workspace
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg_cache

    steps:
    - name: Checkout code
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

    - name: Clone and sync vcpkg to baseline
      run: bash .github/scripts/setup-vcpkg.sh

    - name: Install host toolchain dependencies
      run: bash .github/scripts/apt-install.sh clang-21

    # Set up caching
    - name: Set up binary cache storage
      uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: ${{ runner.os }}-vcpkg-linux-${{ hashFiles('vcpkg.json', 'extras/cmake/vcpkg-linux.toolchain.cmake', 'extras/cmake/x64-linux-release.cmake') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-linux-

    - name: Configure CMake
      run: |
        mkdir -p ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        cmake -B build -G Ninja \
          -DCMAKE_C_COMPILER=clang-21 \
          -DCMAKE_CXX_COMPILER=clang++-21 \
          -DVCPKG_TARGET_TRIPLET=x64-linux-release \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/extras/cmake/vcpkg-linux.toolchain.cmake

    - name: Compile
      run: cmake --build build --parallel $(nproc)


  windows-cross-build:
    runs-on: ubuntu-26.04

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      # Force vcpkg to use an explicit local folder inside the workspace
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg_cache

    steps:
    - name: Checkout code
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

    - name: Clone and sync vcpkg to baseline
      run: bash .github/scripts/setup-vcpkg.sh

    - name: Install host toolchain dependencies
      run: bash .github/scripts/apt-install.sh clang-21

    - name: Setup LLVM-MinGW Toolchain
      run: |
        mkdir -p /opt/llvm-mingw
        curl -L https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz | tar -xJ --strip-components=1 -C /opt/llvm-mingw
        echo "/opt/llvm-mingw/bin" >> $GITHUB_PATH

    - name: Set up binary cache storage
      uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: ${{ runner.os }}-vcpkg-win-${{ hashFiles('vcpkg.json', 'extras/cmake/vcpkg-windows.toolchain.cmake', 'extras/cmake/x64-mingw-static-release.cmake', 'extras/cmake/llvm-mingw-compiler.cmake') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-win-

    - name: Configure CMake
      run: |
        mkdir -p ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        cmake -B build -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/extras/cmake/vcpkg-windows.toolchain.cmake \
          -D_WIN32_WINNT=0x0A00

    - name: Compile
      run: cmake --build build --parallel $(nproc)
