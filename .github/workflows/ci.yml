name: Linux build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux-build:
    runs-on: ubuntu-26.04

    # Binary cache configuration
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install host toolchain dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang-21 cmake ninja-build

    - name: Bootstrap vcpkg and install dependencies
      uses: lukka/run-vcpkg@v11
      with:
        runVcpkgInstall: false      # Do not build for vcpkg.json, we will do it with CMake's manifes tmode

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_C_COMPILER=clang-21 \
          -DCMAKE_CXX_COMPILER=clang++-21 \
          -DVCPKG_TARGET_TRIPLET=x64-linux-release \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/extras/cmake/vcpkg-linux.toolchain.cmake

    - name: Compile
      run: cmake --build build --parallel $(nproc)

