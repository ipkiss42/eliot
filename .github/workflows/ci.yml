name: Linux/Windows builds

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux-build:
    runs-on: ubuntu-26.04

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      # Force vcpkg to use an explicit local folder inside the workspace
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg_cache

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Clone and sync vcpkg to baseline
      run: |
        # Extract the builtin-baseline hash from vcpkg.json
        BASELINE_SHA=$(grep -o '"builtin-baseline": *"[^"]*"' vcpkg.json | sed 's/.*"builtin-baseline": *"\([^"]*\)".*/\1/')
        echo "Target Baseline SHA: $BASELINE_SHA"

        # Initialize a local repository folder
        mkdir -p ${{ env.VCPKG_ROOT }}
        git init ${{ env.VCPKG_ROOT }}

        # Fetch only the exact baseline commit directly from GitHub (shallow fetch)
        git -C ${{ env.VCPKG_ROOT }} remote add origin https://github.com/microsoft/vcpkg.git
        git -C ${{ env.VCPKG_ROOT }} fetch --depth 1 origin "$BASELINE_SHA"
        git -C ${{ env.VCPKG_ROOT }} checkout FETCH_HEAD

    - name: Install host toolchain dependencies
      # First apt install for gperf
      # Second one for libxcrypt
      # Third one for qtbase
      # Fourth one is for eliot's build (without dependencies)
      run: |
        sudo apt update
        sudo apt install -y autoconf autoconf-archive automake libtool
        sudo apt install -y libltdl-dev
        sudo apt install -y pkgconf libx11-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb-xkb-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev libxi-dev \
            '^libxcb.*-dev' libxrender-dev libglu1-mesa-dev libsm-dev libice-dev
        sudo apt install -y gettext clang-21 cmake ninja-build

    # Set up caching
    - name: Set up binary cache storage
      uses: actions/cache@v6
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: ${{ runner.os }}-vcpkg-linux-${{ hashFiles('vcpkg.json', 'extras/cmake/vcpkg-linux.toolchain.cmake', 'extras/cmake/x64-linux-release.cmake') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-linux-

    - name: Configure CMake
      run: |
        mkdir -p ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        cmake -B build -G Ninja \
          -DCMAKE_C_COMPILER=clang-21 \
          -DCMAKE_CXX_COMPILER=clang++-21 \
          -DVCPKG_TARGET_TRIPLET=x64-linux-release \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/extras/cmake/vcpkg-linux.toolchain.cmake

    - name: Compile
      run: cmake --build build --parallel $(nproc)


  windows-cross-build:
    runs-on: ubuntu-26.04

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      # Force vcpkg to use an explicit local folder inside the workspace
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg_cache

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Clone and sync vcpkg to baseline
      run: |
        # Extract the builtin-baseline hash from vcpkg.json
        BASELINE_SHA=$(grep -o '"builtin-baseline": *"[^"]*"' vcpkg.json | sed 's/.*"builtin-baseline": *"\([^"]*\)".*/\1/')
        echo "Target Baseline SHA: $BASELINE_SHA"

        # Initialize a local repository folder
        mkdir -p ${{ env.VCPKG_ROOT }}
        git init ${{ env.VCPKG_ROOT }}

        # Fetch only the exact baseline commit directly from GitHub (shallow fetch)
        git -C ${{ env.VCPKG_ROOT }} remote add origin https://github.com/microsoft/vcpkg.git
        git -C ${{ env.VCPKG_ROOT }} fetch --depth 1 origin "$BASELINE_SHA"
        git -C ${{ env.VCPKG_ROOT }} checkout FETCH_HEAD

    - name: Install build systems
      # First apt install for gperf
      # Second one for libxcrypt
      # Third one for qtbase
      # Fourth one is for eliot's build (without dependencies)
      run: |
        sudo apt update
        sudo apt install -y autoconf autoconf-archive automake libtool
        sudo apt install -y libltdl-dev
        sudo apt install -y pkgconf libx11-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb-xkb-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev libxi-dev \
            '^libxcb.*-dev' libxrender-dev libglu1-mesa-dev libsm-dev libice-dev
        sudo apt install -y gettext cmake ninja-build

    - name: Setup LLVM-MinGW Toolchain
      run: |
        mkdir -p /opt/llvm-mingw
        curl -L https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz | tar -xJ --strip-components=1 -C /opt/llvm-mingw
        echo "/opt/llvm-mingw/bin" >> $GITHUB_PATH

    - name: Set up binary cache storage
      uses: actions/cache@v6
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: ${{ runner.os }}-vcpkg-win-${{ hashFiles('vcpkg.json', 'extras/cmake/vcpkg-windows.toolchain.cmake', 'extras/cmake/x64-mingw-static-release.cmake', 'extras/cmake/llvm-mingw-compiler.cmake') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-win-

    - name: Configure CMake
      run: |
        mkdir -p ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        cmake -B build -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/extras/cmake/vcpkg-windows.toolchain.cmake \
          -D_WIN32_WINNT=0x0A00

    - name: Compile
      run: cmake --build build --parallel $(nproc)
