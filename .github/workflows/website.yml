name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out sources
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install Hugo
        shell: bash
        run: |
          ELIOT_HUGO_VERSION=$(cat website/.hugo-version)
          ELIOT_HUGO_ARCHIVE="hugo_${ELIOT_HUGO_VERSION}_linux-amd64.tar.gz"
          ELIOT_HUGO_RELEASE="https://github.com/gohugoio/hugo/releases/download/v${ELIOT_HUGO_VERSION}"
          mkdir -p "$RUNNER_TEMP/hugo"
          cd "$RUNNER_TEMP/hugo"
          curl --fail --location --retry 3 "$ELIOT_HUGO_RELEASE/$ELIOT_HUGO_ARCHIVE" --output "$ELIOT_HUGO_ARCHIVE"
          curl --fail --location --retry 3 "$ELIOT_HUGO_RELEASE/hugo_${ELIOT_HUGO_VERSION}_checksums.txt" --output checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$ELIOT_HUGO_ARCHIVE" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: Build website
        env:
          ELIOT_BASE_URL: ${{ steps.pages.outputs.base_url || 'https://example.org/eliot' }}/
        run: |
          hugo --source website --baseURL "$ELIOT_BASE_URL" \
            --cacheDir "$RUNNER_TEMP/hugo-cache" --minify --panicOnWarning --cleanDestinationDir
          # GitHub Pages uses a single root error page for all languages
          cp website/public/fr/404.html website/public/404.html
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
