<!doctype html>
<html lang="{{ .Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="{{ .Site.Params.author }}">
  <meta name="description" content="{{ .Site.Params.description }}">
  <title>{{ if .IsHome }}Eliot - An Open Source software for playing Scrabble{{ else }}{{ .Title }} — Eliot{{ end }}</title>
  <link rel="canonical" href="{{ .Permalink }}">
  {{ range .AllTranslations }}
  <link rel="alternate" hreflang="{{ .Language.Locale }}" href="{{ .Permalink }}">
  {{ end }}
  <link rel="icon" href="{{ "layout/favicon.ico" | relURL }}">
  <link rel="stylesheet" href="{{ "layout/eliot.css" | relURL }}">
</head>
<body>
  <header class="site-header">
    <a class="home-link" href="{{ .Site.Home.RelPermalink }}">
      <img class="logo" src="{{ "layout/eliot2.png" | relURL }}" alt="{{ printf "Eliot — %s" (i18n "overview") }}" width="363" height="75">
    </a>
    <nav class="languages" aria-label="{{ i18n "languages" }}">
      {{ range .AllTranslations }}
      <a href="{{ .RelPermalink }}" lang="{{ .Language.Locale }}" hreflang="{{ .Language.Locale }}"><img src="{{ printf "layout/%s" .Site.Params.flag | relURL }}" alt="" width="36" height="24">{{ .Language.Label }}</a>
      {{ end }}
    </nav>
  </header>
  {{ partial "navigation.html" . }}
  <main id="main" class="{{ .Type }}">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
